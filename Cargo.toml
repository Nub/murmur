[package]
name = "murmur"
version = "0.1.0"
edition = "2021"
description = "Decentralized P2P chat - native GUI, no browser tech"

[dependencies]
# P2P networking
libp2p = { version = "0.54", features = [
    "tokio",
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "kad",
    "identify",
    "tcp",
    "dns",
    "macros",
    "request-response",
    "cbor",
    "quic",
    "ed25519",
    "autonat",
    "upnp",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Native GUI — egui (pure native rendering via wgpu/glow, no webview)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "persistence", "x11", "wayland"] }
egui = "0.31"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Storage
sled = "0.34"

# Crypto & identity (E2E encryption)
ed25519-dalek = { version = "2", features = ["serde"] }
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# WebRTC for voice/video/screen share
webrtc = "0.11"

# Audio capture and playback
cpal = "0.15"

# Opus audio codec
opus = "0.3"

# Noise suppression (pure Rust RNNoise port)
nnnoiseless = "0.5"

# Audio resampling
rubato = "0.16"

# Screen capture (stubbed - platform-specific backends added later)

# Ring buffer for audio
ringbuf = "0.4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
dirs = "5"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
